# FAH-Proxy: Caddy (Motor) + fah-proxy (Oberfläche). Ports und Adresse stehen in .env (legt manage.sh an).
services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: ${PROJEKT:-fah-proxy}-caddy
    restart: unless-stopped
    # wartet, bis fah-proxy das erste Caddyfile geschrieben hat
    entrypoint: ["/bin/sh", "-c", "while [ ! -s /fahproxy/caddy/Caddyfile ]; do sleep 1; done; exec caddy run --config /fahproxy/caddy/Caddyfile --adapter caddyfile"]
    ports:
      - "${PROXY_HTTP_PORT:-28080}:80"
      - "${PROXY_HTTPS_PORT:-28443}:443"
    volumes:
      - ./daten/caddy:/fahproxy/caddy
      - ./daten/zertifikate:/fahproxy/zertifikate:ro
      - ./caddy-daten:/data
      - ./caddy-config:/config

  fah-proxy:
    build: .
    image: fah-proxy:lokal
    container_name: ${PROJEKT:-fah-proxy}
    restart: unless-stopped
    ports:
      - "${UI_PORT:-28181}:8443"
    labels:
      fahnas.webui: "https://{HOST}:${UI_PORT:-28181}/"
    environment:
      TZ: Europe/Berlin
      HOST_IP: ${HOST_IP:-}
      UI_PORT: ${UI_PORT:-28181}
      PROXY_HTTP_PORT: ${PROXY_HTTP_PORT:-28080}
      PROXY_HTTPS_PORT: ${PROXY_HTTPS_PORT:-28443}
    volumes:
      - ./daten:/daten
      - ./caddy-daten:/caddy-daten:ro

# Festes Docker-Netz: ohne Angabe vergibt Docker nach 172.17–31 automatisch 192.168.x.0/20 – das überdeckte am 09.10. das
# WireGuard-VPN 192.168.5.0/24, Antworten ans VPN landeten im Docker-Netz statt beim Gateway. Bereich per .env DOCKER_NETZ.
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_NETZ:-172.16.28.0/24}
